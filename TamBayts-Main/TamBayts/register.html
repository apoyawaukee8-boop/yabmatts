<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f3">
    <title>Student registration | TamBayts</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="auth.css">
  </head>
  <body class="register-page auth-light">
    <main class="auth-shell">
      <a class="brand" href="index.html">TamBayts</a>

      <section class="auth-card">
        <p class="eyebrow">STUDENT ACCOUNT</p>
        <h1>Create your account</h1>
        <p class="subhead">Use your account to place orders and follow their status.</p>

        <form id="register-form">
          <label>
            Full name
            <input
              name="name"
              autocomplete="name"
              maxlength="120"
              placeholder="Your name"
              required
            >
          </label>
          <label>
            School email
            <input
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@school.edu"
              required
            >
          </label>
          <label>
            Course <small>Optional</small>
            <input
              name="course"
              maxlength="120"
              placeholder="e.g. BS Information Technology"
            >
          </label>
          <label>
            Password
            <input
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              placeholder="At least 8 characters"
              required
            >
          </label>

          <p class="form-error" id="auth-error" role="alert"></p>
          <button class="submit-button" type="submit">
            Create student account <span>→</span>
          </button>
        </form>

        <p class="auth-footer">
          Already registered? <a href="login.html">Sign in</a>
        </p>
      </section>

      <p class="fine-print">Administrator accounts are created by the system administrator.</p>
    </main>

    <script src="auth.js?v=20261028-3"></script>
  </body>
</html>
