<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f3">
    <title>Administrator setup | TamBayts</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="auth.css">
  </head>
  <body class="setup-admin-page auth-light">
    <main class="auth-shell">
      <a class="brand" href="index.html">TamBayts</a>

      <section class="auth-card">
        <p class="eyebrow">ONE-TIME LOCAL SETUP</p>
        <h1>Create administrator</h1>
        <p class="subhead">
          Initial setup works only when opened from this computer and before an admin account exists.
        </p>

        <form id="setup-admin-form">
          <label>
            Full name
            <input name="name" autocomplete="name" maxlength="120" required>
          </label>
          <label>
            Administrator email
            <input
              name="email"
              type="email"
              autocomplete="email"
              maxlength="190"
              required
            >
          </label>
          <label>
            Password
            <input
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="12"
              placeholder="At least 12 characters"
              required
            >
          </label>

          <p class="form-error" id="auth-error" role="alert"></p>
          <button class="submit-button" type="submit">
            Set up administrator <span>→</span>
          </button>
        </form>

        <p class="auth-footer">
          <a href="login.html?role=admin">Back to sign in</a>
        </p>
      </section>

      <p class="fine-print">Setup closes automatically after the first administrator account is created.</p>
    </main>

    <script src="auth.js?v=20261028-3"></script>
  </body>
</html>
